knp_paginator:
    page_range: 5                   # Nombre de pages affichées dans la pagination
    default_options:
        page_name: page             # Paramètre de la page dans l'URL (par défaut "page")
        sort_field_name: sort       # Paramètre de tri dans l'URL
        sort_direction_name: direction # Paramètre de direction de tri dans l'URL
        distinct: true              # Utiliser DISTINCT lors des requêtes SQL
    template:
        pagination: '@KnpPaginator/Pagination/twitter_bootstrap_v4_pagination.html.twig' # Template par défaut